# nginx.conf — Custom Nginx config for the React SPA
# This fixes the "404 on page refresh" issue with React Router.
# When the user visits /cart directly, Nginx would normally look for
# a file called "cart" on disk (which doesn't exist).
# "try_files $uri /index.html" tells Nginx: if the file doesn't exist,
# fall back to index.html and let React Router handle the route.

server {
    listen 80;

    # Serve static files from this directory
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Try to find the exact file → then directory → then fall back to index.html
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container
    # Any request starting with /products or /cart is forwarded to the backend
    location /products {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /cart {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
