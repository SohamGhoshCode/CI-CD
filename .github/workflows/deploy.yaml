# ─── CI/CD Pipeline for ShopEasy ──────────────────────────────────────────────
# Trigger: Every push to the main branch
#
# Jobs:
#   1. test    → Install deps, check backend + frontend build
#   2. deploy  → SSH into EC2, pull latest code, rebuild Docker containers
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   EC2_HOST       → 51.20.12.30        (your EC2 public IP)
#   EC2_USERNAME   → ubuntu             (EC2 login user)
#   EC2_SSH_KEY    → <private key PEM>  (your .pem file contents)

name: CI/CD — Build & Deploy ShopEasy

on:
  push:
    branches:
      - main               # Run pipeline on every push to main
  pull_request:
    branches:
      - main               # Also run tests on PRs (but NOT deploy)

jobs:

  # ── Job 1: CI — Test & Build ────────────────────────────────────────────────
  test:
    name: 🧪 Test & Build
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js (same version we use locally)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Step 3: Install backend dependencies
      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      # Step 4: Install frontend dependencies
      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      # Step 5: Build the React frontend (catches any build errors)
      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # Step 6: Verify backend starts correctly (quick smoke test)
      - name: Verify backend syntax
        run: node --check server.js
        working-directory: backend

  # ── Job 2: CD — Deploy to EC2 ───────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: test                  # Only deploy if the test job passed
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # ↑ Only deploy on direct push to main (not on PRs)

    steps:
      # Step 1: Checkout code (needed for context, not strictly required here)
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: SSH into the EC2 server and deploy
      # This runs a series of commands on the remote server:
      #   - Pull latest code from GitHub
      #   - Rebuild and restart Docker containers
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}         # EC2 public IP
          username: ubuntu                      # EC2 default user (NOT root — root SSH is disabled on AWS)
          key: ${{ secrets.SSH_KEY }}            # PEM private key content
          script: |
            # Navigate to the project directory
            cd /home/ubuntu/CI-CD

            echo "📥 Pulling latest code from GitHub..."
            git pull origin main

            echo "🐳 Rebuilding and restarting Docker containers..."
            docker compose down
            docker compose up --build -d

            echo "🧹 Removing unused Docker images to save disk space..."
            docker image prune -f

            echo "✅ Deployment complete!"
            docker ps   # Print running containers for confirmation
